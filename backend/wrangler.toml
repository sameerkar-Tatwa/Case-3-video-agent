name = "case3-iris-worker"
main = "worker.js"
compatibility_date = "2026-10-23"

# Environmental variables (Non-sensitive)
[vars]
ANAM_PERSONA_ID = "603598a2-e60a-41fd-a5f3-4347900dd2e5"

# Static Assets (serves frontend/index.html & assets directly from Cloudflare edge)
[assets]
directory = "../frontend"
binding = "ASSETS"

# Note: Store your sensitive ANAM_API_KEY using:
# npx wrangler secret put ANAM_API_KEY
# Or for local development in .dev.vars (see .dev.vars.example)

